<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Lab: Electricity Experiments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --panel:#FFFFFF; --ink:#1D2B3A; --muted:#5A6A7B; --line:#D2DBE5;
  --grid:#E3EAF2; --spark:#FFC83A; --blue:#2F6FDE; --red:#E5484D; --green:#1F9D6B;
  --copper:#B8733A; --zinc:#9AA3AD; --glass:#E6ECF2; --skin:#E9B98F; --graphite:#4A4F57;
  --on-blue:#FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111C28; --panel:#182635; --ink:#E7EEF6; --muted:#9FB2C6; --line:#2B3D51;
    --grid:#1A2938; --blue:#6EA0FF; --red:#FF6B6F; --green:#3CC98F; --glass:#2A3B4F;
    --graphite:#8D949E; --on-blue:#0E1823; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111C28; --panel:#182635; --ink:#E7EEF6; --muted:#9FB2C6; --line:#2B3D51;
  --grid:#1A2938; --blue:#6EA0FF; --red:#FF6B6F; --green:#3CC98F; --glass:#2A3B4F;
  --graphite:#8D949E; --on-blue:#0E1823; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.disp{font-family:Fredoka,"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;align-items:center;padding:40px 0 16px}
.hero h1{font-size:clamp(44px,8vw,76px);font-weight:700;letter-spacing:-.01em}
.hero p{max-width:34em;color:var(--muted);margin:12px 0 0;font-size:19px}
.hero .meter{margin-top:18px;font-family:Fredoka,sans-serif;font-size:18px}
.bigbulb{width:100%;max-width:260px;justify-self:center}
.path{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:18px 0 56px}
.tile{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);min-height:112px}
.tile:hover{border-color:var(--blue)}
.tile .num{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-weight:600;background:var(--glass);border:2px solid var(--ink)}
.tile.done .num{background:var(--spark);color:#1D2B3A;box-shadow:0 0 0 6px color-mix(in srgb,var(--spark) 35%,transparent)}
.tile h3{font-size:20px}
.tile p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.unit{grid-column:1/-1;font-family:Fredoka,sans-serif;font-size:22px;margin:14px 0 0;color:var(--ink)}
.unit span{color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif;font-size:16px;margin-left:8px}
.foot{color:var(--muted);font-size:15px;border-top:2px solid var(--line);padding:18px 0 40px}
.foot p{margin:0 0 8px}
.dpad{display:inline-grid;grid-template-columns:repeat(3,40px);grid-template-rows:auto 34px 34px;gap:4px;justify-items:center;align-items:center;margin-left:auto}
.dlbl{grid-column:1/-1;font-size:13px;color:var(--muted);white-space:nowrap}
.dbtn{width:40px;height:34px;border:2px solid var(--line);background:var(--panel);border-radius:8px;font-size:18px;line-height:1;touch-action:none}
.dbtn:active{background:var(--spark);color:#1D2B3A}
.d-up{grid-column:2;grid-row:2}.d-left{grid-column:1;grid-row:3}.d-down{grid-column:2;grid-row:3}.d-right{grid-column:3;grid-row:3}
.dpad.xonly{grid-template-rows:auto 34px}.dpad.xonly .d-left,.dpad.xonly .d-right{grid-row:2}
.pct{fill:var(--ink);font:600 18px Fredoka,sans-serif;text-anchor:middle}
.stagewrap{position:relative}
.predict{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:16px;padding:16px;z-index:3}
.pcard{background:var(--panel);border:3px solid var(--spark);border-radius:16px;padding:18px 20px;max-width:460px;width:100%}
.pcard h3{font-size:24px}.pcard p{margin:6px 0 12px;font-size:19px}
.popts{display:flex;flex-direction:column;gap:8px}.popts .btn{text-align:left}
.skip{background:none;border:0;color:var(--muted);text-decoration:underline;margin-top:10px;padding:0;font-size:15px}
.why{max-width:44em;margin:18px 0 0;background:color-mix(in srgb,var(--green) 12%,var(--panel));border:2px solid var(--green);border-radius:14px;padding:14px 18px}
.why h3{font-size:22px;margin-bottom:4px}.why p{margin:6px 0}
.pr{font-weight:700}
.teach{max-width:44em;margin:18px 0 0;border:2px dashed var(--blue);border-radius:14px;padding:12px 16px;background:var(--panel)}
.teach h3{font-size:20px;color:var(--blue)}.teach p{margin:6px 0}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.qs{padding-left:22px}.qs li{margin-bottom:12px}.qs p{margin:0 0 6px}
.qs textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.qs textarea:focus{border-color:var(--blue);outline:none}
.saved{color:var(--muted);font-size:14px;min-height:1.2em;margin:0}
.quiz fieldset{border:2px solid var(--line);border-radius:14px;background:var(--panel);margin:0 0 14px;padding:12px 16px;max-width:44em}
.quiz legend{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px;padding:0 6px}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.opt:hover{background:var(--grid)}
.opt input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.opt.key{border-color:var(--blue);border-style:dashed}
.opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.opt.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent)}
.expl{margin:6px 4px 0;color:var(--muted)}
.tile.check .num{border-style:dashed}
.tile.locked{opacity:.5;cursor:not-allowed}
.tile.locked:hover{border-color:var(--line)}
.unit .lockmsg{display:block;margin:4px 0 0}
.lockbox{max-width:36em;margin:48px auto;text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:28px}
.lockbox .btn{display:inline-block;text-decoration:none}
.homebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.homebar label{display:flex;gap:8px;align-items:center;font-weight:700}
.homebar input,.tform input{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 10px;width:180px}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
.badge{background:var(--blue);color:var(--on-blue);border-radius:999px;padding:3px 10px;font-size:14px;font-family:Fredoka,sans-serif}
.keep{padding:0 0 30px}.keep h2{font-size:26px;margin-bottom:10px}
.keepgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.keepgrid a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-left:8px solid var(--blue);border-radius:12px;padding:14px 16px}
.keepgrid a:hover{border-color:var(--blue)}
.keepgrid b{font-family:Fredoka,sans-serif;font-weight:600;font-size:20px}.keepgrid span{color:var(--muted);font-size:16px}
.footbtns{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.tform{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}.tform label{display:flex;gap:8px;align-items:center}
.terr{color:var(--red);font-weight:700}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:20px}
.mcard{background:var(--panel);border-radius:16px;padding:18px;width:min(560px,100%)}
.mcard textarea{width:100%;font:14px/1.4 ui-monospace,monospace;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}

/* ---------- Activity ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.top a{color:var(--ink);font-family:Fredoka,sans-serif;font-weight:600;text-decoration:none;padding:6px 10px;border-radius:8px}
.top a:hover{background:var(--grid)}
.top .grow{flex:1}
.top .count{color:var(--muted);font-size:15px}
.act-head{display:flex;gap:16px;align-items:center;padding:26px 0 8px}
.act-head .num{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:24px;font-weight:600;border:3px solid var(--ink);background:var(--glass)}
.act-head.done .num{background:var(--spark);color:#1D2B3A}
.act-head h2{font-size:clamp(30px,5vw,42px)}
.idea{max-width:40em;margin:6px 0 14px}
.challenge{display:flex;gap:10px;align-items:baseline;max-width:40em;background:var(--panel);border-left:6px solid var(--spark);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:16px}
.challenge b{font-family:Fredoka,sans-serif;font-weight:600}
.challenge.won{border-left-color:var(--green)}
.stage{background-color:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;border:2px solid var(--line);border-radius:16px;padding:12px}
.sim{display:block;width:100%;height:auto;max-height:62vh;touch-action:none;user-select:none;-webkit-user-select:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 4px 4px}
.controls label{display:flex;align-items:center;gap:10px;font-weight:700}
.controls input[type=range]{width:200px;accent-color:var(--blue)}
.btn{background:var(--blue);color:var(--on-blue);border:0;border-radius:10px;padding:10px 16px;font-family:Fredoka,sans-serif;font-weight:600;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn[aria-pressed="true"]{background:var(--spark);color:#1D2B3A}
.btn.ghost[aria-pressed="true"]{border-color:var(--spark)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;flex-wrap:wrap;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:9px 14px;font-family:Fredoka,sans-serif;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.status{min-height:1.6em;margin:8px 4px 2px;font-weight:700}
.readout{font-family:Fredoka,sans-serif;font-size:19px;padding:4px 10px;border-radius:8px;background:var(--grid)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:16px}
.chip.c-yes{border-color:var(--green)}
.chip.c-no{border-color:var(--red)}
.chip.tested{opacity:.55}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sort div{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:60px}
.sort h4{margin:0 0 6px;font-family:Fredoka,sans-serif;font-weight:600}
.notice,.real{max-width:44em}
.notice{margin:22px 0 0}
.notice h3,.real h3{font-size:24px;margin-bottom:6px}
.real{margin:22px 0 10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 18px}
.real ul,.real ol{margin:6px 0 10px;padding-left:22px}
.real .safe{color:var(--muted);font-size:16px;margin:0}
.pager{display:flex;justify-content:space-between;gap:12px;padding:20px 0 48px}
.pager a{font-family:Fredoka,sans-serif;font-weight:600;color:var(--blue);text-decoration:none;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;font-family:Fredoka,sans-serif;font-size:19px;transition:transform .35s ease;z-index:20}
.toast.show{transform:translate(-50%,0)}
.tip{position:fixed;z-index:30;max-width:280px;background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:10px;font-size:15px;line-height:1.4;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.tip b{display:block;font-family:Fredoka,sans-serif;font-weight:600;font-size:17px;color:var(--spark);margin-bottom:2px}
.gl{border-bottom:2px dotted var(--blue);cursor:help}
.hovhint{color:var(--muted);font-size:15px;margin:8px 4px 0}

/* ---------- Appliances ---------- */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:6px}
.app{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.app .e{font-size:28px;line-height:1}
.app b{font-family:Fredoka,sans-serif;font-weight:600}
.app small{color:var(--muted)}
.app[aria-pressed="true"]{border-color:var(--spark);background:color-mix(in srgb,var(--spark) 22%,var(--panel))}
.app:disabled{opacity:.4}
.loadbar{height:26px;border-radius:13px;background:var(--grid);border:2px solid var(--line);overflow:hidden;position:relative;margin:8px 6px}
.loadbar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s,background .25s}
.loadbar span{position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:15px}


.say{background:none;border:2px solid var(--line);border-radius:999px;width:32px;height:32px;padding:0;font-size:15px;line-height:1;vertical-align:middle;margin-left:4px}
.say:hover{border-color:var(--blue)}
.stds{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
.std{font-size:13px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);border-radius:999px;padding:1px 9px;cursor:help}
.sync{font-size:13px;color:var(--muted);white-space:nowrap}
.sync[data-state="on"]{color:var(--green)}
.deeprow{padding:0 0 10px}
.plab{fill:var(--ink);font:600 13px Fredoka,sans-serif;text-anchor:middle;paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.flowarrow{fill:none;stroke-linecap:round;opacity:.85}
.ebar{display:flex;height:30px;border-radius:15px;overflow:hidden;border:2px solid var(--line);margin:8px 4px}
.ebar span{display:grid;place-items:center;font-size:13px;color:#1D2B3A;font-weight:700}
.dash h3{font-family:Fredoka,sans-serif;font-size:22px;margin:22px 0 8px}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:10px;align-items:center;font-size:15px}
.bt{height:14px;background:var(--grid);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bt i{display:block;height:100%;background:var(--green)}
.bn{color:var(--muted);font-size:14px;white-space:nowrap}
.srow{background:var(--panel);border:2px solid var(--line);border-radius:12px;margin:0 0 8px;padding:8px 12px}
.srow summary{display:flex;flex-wrap:wrap;gap:6px 18px;cursor:pointer;font-size:15px}
.srow .sn{font-weight:700;min-width:140px}.srow .sw{color:var(--muted)}
.dact{border-top:1px solid var(--line);padding:8px 0}
.dp,.dq span{color:var(--muted);font-size:14px}.dq p{margin:2px 0 6px}
.guide{max-width:52em;padding:20px 0 60px}
.guide h1{font-size:36px;margin:10px 0}
.gunit{font-size:26px;margin:30px 0 8px;border-bottom:3px solid var(--spark);padding-bottom:4px}
.gsec{break-inside:avoid;margin:14px 0;padding:12px 16px;background:var(--panel);border:2px solid var(--line);border-radius:12px}
.gsec h3{font-size:20px}.gsec p{margin:6px 0}.gmeta{font-size:14px;color:var(--muted)}
.gbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:15px}
@media print{
  .top,.noprint,.toast,.tip,body::before{display:none!important}
  :root{--paper:#fff;--panel:#fff;--ink:#000;--muted:#333;--line:#bbb}
  body{background:#fff;font-size:12pt}
  .gsec{border:1px solid #bbb}
}
@media (max-width:600px){
  body{font-size:17px}
  .wrap{padding:0 12px}
  .stage{padding:6px;border-radius:12px;background-size:16px 16px}
  .controls{gap:8px}
  .controls input[type=range]{width:120px}
  .btn{padding:8px 12px;font-size:16px}
  .seg button{padding:8px 10px;font-size:15px}
  .dpad{margin-left:0}
  .top .count,.top .sync{display:none}
  .top .wrap{flex-wrap:wrap;gap:6px}
  .act-head{gap:10px;padding-top:18px}
  .act-head .num{width:44px;height:44px;font-size:20px}
  .hero h1{font-size:44px}
  .apps{grid-template-columns:repeat(2,1fr)}
  .sim{max-height:none}
  .barrow{grid-template-columns:1fr;gap:2px}
  .pcard{padding:14px}
  .predict{align-items:start}
}

.pres{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper)}
.pslide{flex:1;width:min(1200px,100%);margin:0 auto;padding:clamp(20px,4vw,48px) clamp(16px,4vw,48px) 24px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.pslide[data-k="try"]{justify-content:flex-start;gap:10px}
.pslide h1{font-size:clamp(40px,6vw,80px)}
.pslide h2{font-size:clamp(30px,4.2vw,56px);line-height:1.15}
.pk{font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(16px,1.6vw,22px);color:var(--blue)}
.pbig{font-size:clamp(22px,2.6vw,36px);line-height:1.45;max-width:36em;margin:0}
.pchal{font-size:clamp(20px,2vw,28px);border-left:8px solid var(--spark);padding:8px 16px;background:var(--panel);border-radius:0 12px 12px 0;max-width:36em;margin:0}
.popts.big{display:grid;gap:12px;max-width:900px}
.popt{font-size:clamp(20px,2.4vw,32px);background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:12px 20px;display:flex;gap:16px;align-items:center;transition:opacity .3s}
.popt b{font-family:Fredoka,sans-serif;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:2px solid var(--ink)}
.popt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 18%,var(--panel))}
.popt.right b{background:var(--green);color:#fff}
.popt.dim{opacity:.4}
.plook{font-size:clamp(20px,2.2vw,30px);background:color-mix(in srgb,var(--green) 12%,var(--panel));border:2px solid var(--green);border-radius:14px;padding:14px 20px;max-width:36em;margin:0}
.pslide .btn{align-self:flex-start;font-size:20px;padding:12px 22px}
.pstage .sim{max-height:68vh}
.preal{display:grid;grid-template-columns:1fr 1.4fr;gap:24px;font-size:clamp(18px,2vw,26px)}
.preal h3{font-size:clamp(22px,2.4vw,32px)}
.psafe{color:var(--muted);font-size:clamp(16px,1.6vw,22px);margin:0}
.pfoot{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--line)}
.pexit{font-size:22px;text-decoration:none;color:var(--ink);padding:2px 10px;border-radius:8px}

<script>
(function(){

/* ---------- pop-up explanations ---------- */
const TIPS={
 battery:['Battery','Stores energy and pushes electrons out of its − end, around the circuit, and back into its + end.'],

};
const CLSTIP={battery:'battery',bulb:'bulb',wire:'wire',flow:'current',electron:'electron',neg:'negative',pos:'positive',balloon:'balloon',string:'balloon',hair:'hair',paper:'paper',gate:'gate',term:'terminal',plug:'plug',copper:'copper',zinc:'zinc',fruit:'fruit',led:'led',lcd:'voltmeter',lcdt:'voltmeter',graphite:'graphite','graphite-live':'graphlive',clipr:'clip',nail:'nail',coil:'coil',pclip:'paperclip',gauge:'meter',needle:'meter',buzzwire:'buzzwire',ring:'ring',handle:'ring',pad:'pad',loadbar:'breaker'};

  for(let n=el;n&&n!==document.body&&n.getAttribute;n=n.parentNode){
    const d=n.getAttribute('data-tip');if(d)return d;

  function place(k){const p=P[k];
    if(tool==='erase'){if(!p)return;delete P[k]}
    else if(!p)P[k]={t:tool,flip:false,closed:false,r:100};
    else if(p.t==='switch')p.closed=!p.closed;
    else if(p.t==='battery'||p.t==='led')p.flip=!p.flip;
    else if(p.t==='resistor')p.r=p.r===10?100:p.r===100?1000:10;
    else if(p.t===tool)delete P[k];
    else P[k]={t:tool,flip:false,closed:false,r:100};
    beep(420,.04,'triangle',.04);render();
  }
  svg.addEventListener('click',e=>{const g=e.target.closest('[data-k]');if(g)place(g.dataset.k)});
  svg.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k&&(e.key==='Enter'||e.key===' ')){e.preventDefault();place(k);const g=svg.querySelector(`.edge[data-k="${k}"][tabindex]`);g&&g.focus()}});
  const setTool=t=>{tool=t;$$('[data-t]',st).forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))};
  $$('[data-t]',st).forEach(b=>b.onclick=()=>setTool(b.dataset.t));setTool('wire');
  const wipe=()=>{for(const k in P)delete P[k]};
  $('#clr',st).onclick=()=>{wipe();render()};
  $('#ex',st).onclick=()=>{wipe();
    P.v0_1={t:'battery',flip:true};

    ['h0_0','h1_0','v4_0','v4_1','h3_2','h1_2','h0_2'].forEach(k=>P[k]={t:'wire'});
    P.h2_0={t:'resistor',r:100};P.h3_0={t:'led',flip:false};P.h2_2={t:'ammeter'};render();

/* ---------- read aloud ---------- */
let TTS=null;
function stripTags(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.replace(/\s+/g,' ').trim()}
function sayBtn(text){return `<button class="say" data-say="${esc(stripTags(text))}" aria-label="${T('listen')}" title="${T('listen')}">🔈</button>`}
function speakLocal(text){
  if(!('speechSynthesis' in window)){toast('Reading aloud isn’t available in this browser.');return}
  if(speechSynthesis.speaking){speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(text);u.lang=isES()?'es-US':'en-US';u.rate=.95;speechSynthesis.speak(u);
}
function speak(text){
  if(TTS){
    try{if(TTS.active()){TTS.stop();return}}catch(e){}
    TTS.speak(text,{language:isES()?'es':'en'}).catch(e=>{if(e&&(e.code==='not_granted'||e.code==='unavailable')){TTS=null;speakLocal(text)}});
    return;
  }
  speakLocal(text);
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.say');if(b){e.preventDefault();speak(b.dataset.say)}});

/* ---------- class sync ---------- */
const CLOUD={db:null,user:null,uid:null,state:'local',teacherOK:false,writing:false,again:false,timer:null};
function syncLabel(){return CLOUD.state==='on'?T('syncOn'):CLOUD.state==='ro'?T('syncRO'):T('syncLocal')}
function paintSync(){$$('.sync').forEach(s=>{s.textContent=syncLabel();s.dataset.state=CLOUD.state})}
function queueSync(){if(!CLOUD.db||CLOUD.state==='ro')return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(pushProgress,1500)}
async function pushProgress(){
  if(!CLOUD.db||CLOUD.state==='ro')return;
  if(CLOUD.writing){CLOUD.again=true;return}
  CLOUD.writing=true;
  try{await CLOUD.db.doc('progress/'+CLOUD.uid).set({done:[...done],pred:PRED,ans:ANS,quiz:QUIZ,name:SET.name||'',lang:SET.lang,updated:Date.now()});CLOUD.state='on'}
  catch(e){if(e&&e.code==='invalid_argument')CLOUD.state='ro'}
  CLOUD.writing=false;paintSync();
  if(CLOUD.again){CLOUD.again=false;queueSync()}
}
const keep0=keep;keep=function(k,v){keep0(k,v);if(k!=='sparklab-set')queueSync()};
const save0=save;save=function(){save0();queueSync()};
function mergeRemote(d){
  let ch=false;
  (d.done||[]).forEach(id=>{if(!done.has(id)){done.add(id);ch=true}});
  for(const k in (d.pred||{}))if(!PRED[k]){PRED[k]=d.pred[k];ch=true}
  for(const k in (d.quiz||{}))if((d.quiz[k]||0)>(QUIZ[k]||0)){QUIZ[k]=d.quiz[k];ch=true}
  for(const k in (d.ans||{})){const r=d.ans[k]||[],l=ANS[k]=ANS[k]||[];r.forEach((v,i)=>{if(v&&!l[i]){l[i]=v;ch=true}})}
  if(!SET.name&&d.name){SET.name=d.name;saveSet();ch=true}
  if(ch){save0();keep0('sparklab-ans',ANS);keep0('sparklab-pred',PRED);keep0('sparklab-quiz',QUIZ)}
  return ch;
}
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  claude.use('tts').then(t=>{TTS=t}).catch(()=>{});
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use('db'),claude.use('user')])}catch(e){}
  CLOUD.user=user;
  if(user){try{CLOUD.teacherOK=(await user.isOwner())||(await user.canEdit())}catch(e){}}
  if(!db||!user){refresh();return}
  let uid=null;try{uid=await user.id()}catch(e){}
  if(!uid){refresh();return}
  CLOUD.db=db;CLOUD.uid=uid;
  try{db.doc('settings/class').onSnapshot(s=>{if(s.exists){const g=s.data().guided;if(typeof g==='boolean'&&g!==SET.guided){SET.guided=g;saveSet();if(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName))route()}}},()=>{})}catch(e){}
  let changed=false;
  try{const snap=await db.doc('progress/'+uid).get();if(snap.exists)changed=mergeRemote(snap.data())}catch(e){}
  CLOUD.state='on';
  if(changed&&(!document.activeElement||!/TEXTAREA|INPUT/.test(document.activeElement.tagName)))route();else refresh();
  pushProgress();
}

    if(!c.dataset.sure){c.dataset.sure=1;c.textContent=T('clear2');return}

    if(CLOUD.teacherOK){SET.teacher=true;saveSet();home();return}
    $('#tform').innerHTML=`<div class="tform"><label>Teacher code <input type="password" id="tc" autocomplete="off"></label><button class="btn" id="tgo">Turn on</button><span id="terr" class="terr" aria-live="polite"></span></div>`;

function lockedView(ui){
  cleanup();cleanup=()=>{};
  const pu=UNITLIST[ui-1];
  app.innerHTML=`${topBar()}<div class="wrap"><div class="lockbox"><h2>${T('lockH')(uName(UNITLIST[ui]))}</h2><p>${T('lockP')(uName(pu))}</p><p><a class="btn" href="#check-${pu.check+1}">${T('take')}</a></p></div></div>`;
  bindChrome();window.scrollTo(0,0);
}
function predictCard(P){return `<div class="predict" id="pred"><div class="pcard" role="dialog" aria-labelledby="pq"><h3>${T('pred')}</h3><p id="pq">${P.q} ${sayBtn(P.q+' '+P.opts.join('. '))}</p><div class="popts">${P.opts.map((o,k)=>`<button class="btn ghost" data-o="${k}">${o}</button>`).join('')}</div>${SET.teacher?'<button class="skip" id="pskip">Skip (teacher mode)</button>':''}</div></div>`}
function showWhy(a){
  const P=XP(a),el=$('#why');if(!P||!el)return;
  const p=PRED[a.id];let pt='';
  if(p)pt=`<p class="pr">${p.ok?T('youGot')(P.opts[p.pick]):T('youMiss')(P.opts[p.pick],P.opts[P.ans])}</p>`;
  el.innerHTML=`<h3>${T('why')} ${sayBtn(P.why)}</h3>${pt}<p>${P.why}</p>`;el.hidden=false;
}
const DEEP=new Set(['pencil-dimmer','build-your-own']);

function activity(i){
  cleanup();hideTip();
  const a=ACTS[i],t=A(a),X=EXTRA[a.id],P=XP(a),ui=unitOf(i),u=UNITLIST[ui],used=new Set();
  if(locked(ui)){lockedView(ui);return}
  const pos=u.acts.indexOf(i);
  let prevL='<span></span>',nextL;
  if(pos>0)prevL=`<a href="#${ACTS[i-1].id}">← ${A(ACTS[i-1]).title}</a>`;
  else if(ui>0)prevL=`<a href="#check-${UNITLIST[ui-1].check+1}">${T('quickPrev')(uName(UNITLIST[ui-1]))}</a>`;
  if(pos<u.acts.length-1)nextL=`<a href="#${ACTS[i+1].id}">${A(ACTS[i+1]).title} →</a>`;
  else if(u.check!=null)nextL=`<a href="#check-${u.check+1}">${T('quickNext')(uName(u))}</a>`;
  else nextL=`<a href="#">${T('backAll')}</a>`;
  const ans=ANS[a.id]||[],isDone=done.has(a.id),needPred=P&&!PRED[a.id]&&!isDone;
  app.innerHTML=`${topBar()}
  <div class="wrap"><div class="act-head ${isDone?'done':''}" id="ah"><span class="num">${i+1}</span><h2>${t.title}</h2></div>${stdChips(a.id)}
  <p class="idea">${gloss(t.idea,used)} ${sayBtn(t.idea)}</p>
  <div class="challenge ${isDone?'won':''}" id="chal"><b>${isDone?T('dn'):T('chal')}</b><span>${t.challenge}</span></div>
  ${DEEP.has(a.id)?`<div class="controls deeprow"><button class="iconbtn" id="deep" aria-pressed="${!!SET.deep}">🔢 ${T('deep')}</button></div>`:''}
  <div class="stagewrap"><section class="stage" id="stage" aria-label="Experiment"></section>${needPred?predictCard(P):''}</div>
  <p class="hovhint">${T('hint')}</p>
  <section class="why" id="why" aria-live="polite" hidden></section>
  ${SET.teacher&&X?`<section class="teach"><h3>Teacher notes</h3><p><b>How to solve it:</b> ${X.how}</p><p><b>Prediction answer:</b> ${X.p[1][X.p[2]]}</p><p><b>Look-fors:</b> ${X.look.join(' ')}</p>${isDone?'':'<button class="btn ghost" id="mark">Mark challenge done</button>'}</section>`:''}
  <section class="notice"><h3>${T('notice')}</h3><ol class="qs">${t.notice.map((q,k)=>`<li><p>${gloss(q,used)} ${sayBtn(q)}</p><textarea rows="2" data-k="${k}" aria-label="${esc(q)}" placeholder="${T('type')}">${esc(ans[k]||'')}</textarea></li>`).join('')}</ol><p class="saved" id="saved"></p></section>

function checkView(c){
  cleanup();cleanup=()=>{};hideTip();
  const ui=UNITLIST.findIndex(u=>u.check===c),u=UNITLIST[ui],QQ=Q(c),next=UNITLIST[ui+1];
  if(locked(ui)){lockedView(ui);return}
  const last=ACTS[u.acts[u.acts.length-1]];
  const nextLink=()=>next&&!locked(ui+1)?`<a href="#${ACTS[next.acts[0]].id}">${A(ACTS[next.acts[0]]).title} →</a>`:'';
  app.innerHTML=`${topBar()}<div class="wrap"><div class="act-head ${passed(c)?'done':''}" id="ah"><span class="num">✓</span><h2>${T('qc')}: ${uName(u)}</h2></div>
  <p class="idea">${T('qcIntro')(SET.guided&&next?uName(next):'')}${QUIZ[c]!=null?T('best')(QUIZ[c]):''}</p>
  <div class="quiz">${QQ.map((q,k)=>`<fieldset data-q="${k}"><legend>${k+1}. ${q[0]} ${sayBtn(q[0]+' '+q[1].join('. '))}</legend>${q[1].map((o,j)=>`<label class="opt ${SET.teacher&&j===q[2]?'key':''}"><input type="radio" name="q${k}" value="${j}"> ${o}</label>`).join('')}<p class="expl" hidden></p></fieldset>`).join('')}
  <div class="controls"><button class="btn" id="sub">${T('check')}</button><button class="btn ghost" id="again" hidden>${T('again')}</button></div><p class="status" id="res" aria-live="polite"></p></div>
  <nav class="pager"><a href="#${last.id}">← ${A(last).title}</a><span id="nx">${nextLink()}</span></nav></div>`;
  bindChrome();
  $('#sub').onclick=()=>{
    const picks=QQ.map((q,k)=>{const r=$(`input[name="q${k}"]:checked`);return r?+r.value:null});
    if(picks.includes(null)){$('#res').textContent=T('answerAll');return}
    let score=0;
    QQ.forEach((q,k)=>{const fs=$(`fieldset[data-q="${k}"]`),ok=picks[k]===q[2];if(ok)score++;
      $$('.opt',fs).forEach((l,j)=>{if(j===q[2])l.classList.add('right');else if(j===picks[k])l.classList.add('wrong')});
      $$('input',fs).forEach(r=>r.disabled=true);const ex=$('.expl',fs);ex.textContent=(ok?T('right'):T('notq'))+q[3];ex.hidden=false});
    const was=passed(c);QUIZ[c]=Math.max(QUIZ[c]||0,score);keep('sparklab-quiz',QUIZ);
    if(score>=3){cheer();$('#ah').classList.add('done');$('#res').textContent=T('pass')(score,next&&!was&&SET.guided?uName(next):'');toast(`${T('qc')}: ${score}/4`)}
    else $('#res').textContent=T('fail')(score);
    $('#nx').innerHTML=nextLink();$('#sub').hidden=true;$('#again').hidden=false;
  };
  $('#again').onclick=()=>checkView(c);
  document.title=`${T('qc')}: ${uName(u)} · Spark Lab`;window.scrollTo(0,0);
}

function renderDash(rows,body,stat){

  ACTS.forEach((a,i)=>{const d=rows.filter(r=>(r.done||[]).includes(a.id)).length,pc=pct(d,N);
    const pr=rows.filter(r=>r.pred&&r.pred[a.id]),ok=pr.filter(r=>r.pred[a.id].ok).length;
    ex+=`<div class="barrow"><span class="bl">${i+1}. ${esc(a.title)}</span><span class="bt"><i style="width:${pc}%"></i></span><span class="bn">${d}/${N} done${pr.length?` · predictions ${ok}/${pr.length} right`:''}</span></div>`});

    ex+=`<div class="barrow"><span class="bl">${esc(u.name)}</span><span class="bt"><i style="width:${pct(ps,N)}%"></i></span><span class="bn">${ps}/${N} passed · ${tk.length} tried</span></div>`});
  ex+='</div><h3>Students</h3>';
  let st='';
  rows.forEach(r=>{
    const d=(r.done||[]).length,pv=Object.values(r.pred||{}),pok=pv.filter(p=>p.ok).length;
    const qs=UNITLIST.filter(u=>u.check!=null).map(u=>r.quiz&&r.quiz[u.check]!=null?r.quiz[u.check]:'–').join(' · ');
    const when=r.updated?new Date(r.updated).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
    let det='';
    ACTS.forEach((a,i)=>{const an=(r.ans||{})[a.id]||[],p=(r.pred||{})[a.id],X=EXTRA[a.id];
      if(!an.some(Boolean)&&!p&&!(r.done||[]).includes(a.id))return;
      det+=`<div class="dact"><b>${i+1}. ${esc(a.title)}</b>${(r.done||[]).includes(a.id)?' ✓':''}${p?`<div class="dp">Prediction: ${esc(X.p[1][p.pick])} ${p.ok?'(right)':'(not quite)'}</div>`:''}${a.notice.map((q,k)=>an[k]?`<div class="dq"><span>${esc(q)}</span><p>${esc(an[k])}</p></div>`:'').join('')}</div>`});
    st+=`<details class="srow"><summary><span class="sn">${esc(r.display)}</span><span>${d}/${TT} done</span><span>Predictions ${pok}/${pv.length}</span><span>Checks: ${qs}</span><span class="sw">${when}</span></summary>${det||'<p>No answers yet.</p>'}</details>`});
  body.innerHTML=ex+st;
}
async function exportCSV(rows){
  const head=['Student','Experiments done','Predictions right','Predictions made',...UNITLIST.filter(u=>u.check!=null).map(u=>'Check: '+u.name),...ACTS.map((a,i)=>`${i+1}. ${a.title} done`),'Last active'];
  const q=v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const lines=[head.map(q).join(',')];
  rows.forEach(r=>{const pv=Object.values(r.pred||{});
    lines.push([r.display,(r.done||[]).length,pv.filter(p=>p.ok).length,pv.length,...UNITLIST.filter(u=>u.check!=null).map(u=>r.quiz&&r.quiz[u.check]!=null?r.quiz[u.check]:''),...ACTS.map(a=>(r.done||[]).includes(a.id)?'yes':''),r.updated?new Date(r.updated).toISOString():''].map(q).join(','))});
  const csv=lines.join('\n');
  let dl=null;try{dl=await claude.use('downloads')}catch(e){}
  if(dl){try{await dl.save({filename:'spark-lab-class.csv',data:csv});return}catch(e){if(e&&e.code!=='unavailable')return}}
  showText('Class data (CSV)','Copy this into a spreadsheet.',csv);
}

try{presUnlocked=sessionStorage.getItem('sparklab-pres')==='1'}catch(e){}
const PS=k=>({exp:isES()?'Experimento':'Experiment',tryit:isES()?'Pruébalo':'Try it',reveal:isES()?'Mostrar la respuesta':'Reveal the answer',listen:'Show what to listen for',of:isES()?'de':'of'})[k];

    else if(k[0]==='q'){const n=+k.slice(1),q=Q(u.check)[n];h=`<div class="pk">${T('qc')}: ${uName(u)} · ${n+1} ${PS('of')} 4</div><h2>${q[0]}</h2>${opts(q[1])}<p class="plook" id="qx" hidden>${q[3]}</p><button class="btn" id="rev">${PS('reveal')}</button>`}

  $('#pfs').onclick=()=>{let r;try{r=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}
    if(!r||!r.catch){if(!document.fullscreenElement)toast('Full screen isn’t available here. Try your browser’s full-screen key.');return}
    r.catch(()=>toast('Full screen isn’t available here. Try your browser’s full-screen key.'))};
  const key=e=>{
    const tg=e.target;
    if(tg&&tg.closest&&(tg.closest('.pstage')||/INPUT|TEXTAREA|SELECT/.test(tg.tagName)))return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1)}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
    else if(e.key==='Escape'&&!document.fullscreenElement)location.hash='present';
  };
  document.addEventListener('keydown',key);
  render();
  cleanup=()=>{simClean();document.removeEventListener('keydown',key)};
  document.title=`${t.title} · Presentation · Spark Lab`;
}

function route(){
  document.documentElement.lang=SET.lang||'en';
  const h=location.hash.slice(1),m=/^check-([1-5])$/.exec(h);
  if(m){checkView(+m[1]-1);return}
  if(h==='guide'){guideView();return}
  if(h==='present'||/^present-\d+$/.test(h)){presentView(h);return}
  if(h==='dashboard'){dashboardView();return}
  const i=ACTS.findIndex(a=>a.id===h);i>=0?activity(i):home();
}
window.addEventListener('hashchange',route);
route();
initCloud();
})();
</script>
